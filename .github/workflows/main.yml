name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble project layout
        run: |
          set -e
          P=proj
          mkdir -p $P/gradle/wrapper $P/src/main/java/com/realshrooms $P/src/main/resources $P/tools
          get() { find . -path "./$P" -prune -o -path ./.git -prune -o -type f -name "$1" -print | head -n 1; }
          place() { f="$(get "$1")"; [ -n "$f" ] || { echo "Missing file: $1"; exit 1; }; cp "$f" "$2"; }
          place build.gradle $P/
          place gradle.properties $P/
          place settings.gradle $P/
          place gradlew $P/
          place gradle-wrapper.jar $P/gradle/wrapper/
          place gradle-wrapper.properties $P/gradle/wrapper/
                    find . -path "./$P" -prune -o -path ./.git -prune -o -type f -name '*.java' -print | while read -r f; do cp "$f" $P/src/main/java/com/realshrooms/; done
          place fabric.mod.json $P/src/main/resources/
          place gen_assets.py $P/tools/
          place gen_gardening.py $P/tools/
          sed -i 's/\r$//' $P/gradlew
          chmod +x $P/gradlew
          find $P -type f | sort

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Generate textures, models, recipes
        run: python tools/gen_gardening.py
        working-directory: proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: ./gradlew build
        working-directory: proj

      - uses: actions/upload-artifact@v4
        with:
          name: realshrooms-jar
          path: proj/build/libs/*.jar
